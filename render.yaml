services:
  # Backend FastAPI Web Service
  - type: web
    name: inkloom-sentinel-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-postgres
          property: connectionString

  # Frontend Vite React Static Site (Global CDN)
  - type: static
    name: inkloom-sentinel-ui
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: inkloom-sentinel-api
          type: web
          property: host

databases:
  - name: inkloom-postgres
    plan: free
    region: oregon

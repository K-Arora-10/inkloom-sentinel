
services:
  # Backend FastAPI
  - type: web
    name: inkloom-sentinel-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-postgres
          property: connectionString

    # Frontend React Static Site
  - type: web
    runtime: static
    name: inkloom-sentinel-ui
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://inkloom-sentinel-api-d40s.onrender.com

databases:
  - name: inkloom-postgres
    plan: free
    region: oregon
